[project]
name = "kayo-voice"
version = "0.1.0"
description = "Kayo voice service: Twilio <-> OpenAI Realtime bridge"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13.1",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "twilio>=9.3",
    "openai>=1.54",
    "supabase>=2.9",
    "apscheduler>=3.10",
    "tenacity>=9.0",
    "structlog>=24.4",
    "sentry-sdk[fastapi]>=2.18",
    "pytz>=2024.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
